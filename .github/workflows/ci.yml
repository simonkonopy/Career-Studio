name: Product checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - name: Install browser for customer journey checks
        run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - name: Verify runtime image builds
        run: docker build --tag career-studio:test .
